<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}DocSign{% endblock %}</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --fg:#1b1f24; --muted:#636c76; --line:#d9dee3; --accent:#0b5fff; --ok:#1a7f37; --warn:#9a6700; --bad:#cf222e; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1115; --card:#171a21; --fg:#e6e8eb; --muted:#9aa4b1; --line:#2a2f3a; --accent:#5b9bff; } }
  * { box-sizing: border-box; }
  body { margin:0; font: 15px/1.5 -apple-system, "Segoe UI", Roboto, "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif; background:var(--bg); color:var(--fg); }
  header { background:var(--card); border-bottom:1px solid var(--line); }
  header .in { max-width:980px; margin:0 auto; padding:12px 16px; display:flex; gap:20px; align-items:center; }
  header a { color:var(--fg); text-decoration:none; font-weight:600; }
  header a.brand { font-size:18px; }
  header .status { margin-left:auto; font-size:13px; color:var(--muted); }
  main { max-width:980px; margin:0 auto; padding:20px 16px 60px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:18px 20px; margin-bottom:18px; }
  h1 { font-size:22px; margin:0 0 6px; } h2 { font-size:17px; margin:0 0 12px; }
  .muted { color:var(--muted); font-size:13px; }
  label { display:block; font-weight:600; margin:12px 0 4px; }
  input[type=text], input[type=date], input[type=number], input[type=email], textarea, select {
    width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg); font:inherit; }
  textarea { min-height:90px; }
  .grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(260px,1fr)); gap:0 20px; }
  .btn { display:inline-block; padding:9px 16px; border-radius:7px; border:1px solid var(--accent); background:var(--accent); color:#fff; font-weight:600; cursor:pointer; text-decoration:none; font:inherit; }
  .btn.secondary { background:transparent; color:var(--accent); }
  .btn.small { padding:5px 10px; font-size:13px; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  table { width:100%; border-collapse:collapse; } th, td { text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); vertical-align:top; }
  .pill { display:inline-block; padding:1px 9px; border-radius:999px; font-size:12px; font-weight:600; border:1px solid var(--line); }
  .pill.missing { color:var(--bad); border-style:dashed; }
  .pill.generated { color:var(--muted); } .pill.sent { color:var(--warn); border-color:var(--warn); } .pill.signed { color:var(--ok); border-color:var(--ok); } .pill.cancelled { color:var(--bad); border-color:var(--bad); }
  .flash { background:#fff8c5; color:#4d3800; border:1px solid #d4a72c; padding:10px 14px; border-radius:8px; margin-bottom:14px; }
  .err { color:var(--bad); font-size:13px; }
  .rcpt { display:grid; grid-template-columns: 1fr 1.4fr 110px 36px; gap:8px; margin-bottom:8px; }
  .rcpt button { border:1px solid var(--line); background:transparent; color:var(--muted); border-radius:6px; cursor:pointer; }
  code { background:var(--bg); padding:1px 5px; border-radius:4px; font-size:13px; }
  details summary { cursor:pointer; font-weight:600; }
  @media (max-width:640px){ .rcpt{ grid-template-columns:1fr 1fr; } }
</style>
</head>
<body>
<header><div class="in">
  <a class="brand" href="{{ url_for('index') }}">DocSign</a>
  <a href="{{ url_for('dashboard') }}">看板</a>
  <a href="{{ url_for('batch') }}">批量生成</a>
  <a href="{{ url_for('employees_page') }}">员工</a>
  <a href="{{ url_for('index') }}">模板</a>
  <a href="{{ url_for('history') }}">记录</a>
  <span class="status">SMTP：{{ '✓' if smtp_ok else '未配置' }} · IMAP：{{ '✓' if imap_ok else '未配置' }} · PDF：{{ '开' if pdf_ok else '关' }}</span>
</div></header>
<main>
  {% with msgs = get_flashed_messages() %}{% for m in msgs %}<div class="flash">{{ m }}</div>{% endfor %}{% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
